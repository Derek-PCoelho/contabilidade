# Folhas da Michelly — servidor central (Java). Todas as chaves "folhas.*" podem vir de variáveis
# de ambiente (ex.: FOLHAS_PHASE10_EMAIL_SEND_ENABLED=true). Pendência 4.18: tudo desligado por padrão.
spring.application.name=folhas-server
spring.main.banner-mode=off
server.port=${PORT:8080}
server.shutdown=graceful
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=12MB
server.tomcat.connection-timeout=15s
server.tomcat.keep-alive-timeout=120s
spring.servlet.multipart.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false
server.forward-headers-strategy=none

spring.datasource.url=${FOLHAS_DB_URL:jdbc:postgresql://127.0.0.1:5432/folhas_development}
spring.datasource.username=${FOLHAS_DB_USER:}
spring.datasource.password=${FOLHAS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000

folhas.environment=${FOLHAS_ENVIRONMENT:Production}
folhas.database.migrate-on-startup=false
folhas.authentication.enable-development-scheme=false
folhas.oidc.issuer=
folhas.oidc.signing-certificate-path=
folhas.oidc.signing-certificate-password=
folhas.allowed-hosts=
folhas.forwarded-headers.known-proxies=

folhas.phase7.microsoft-graph.email-send-enabled=false
folhas.phase8.gmail.email-send-enabled=false
folhas.phase10.email-send-enabled=false
folhas.phase10.beta-channel-enabled=false
folhas.phase10.stable-channel-enabled=false
folhas.phase11.enabled=false
folhas.phase11.allow-test=false
folhas.phase11.allow-draft=false
folhas.phase11.allow-send=false
folhas.phase11.require-non-production-data=true
folhas.phase11.maximum-clients=5
folhas.phase12.enabled=false
folhas.phase12.environment-name=production
folhas.phase12.stage=Closed
folhas.phase12.pilot-approved=false
folhas.phase12.allow-send=false
folhas.phase12.maximum-batch-size=5
folhas.phase12.maximum-daily-sends=20
folhas.phase12.allowed-roles=OwnerTechnical,Administrator,Manager
